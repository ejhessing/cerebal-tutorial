<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Escape - Survival Strategy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
            color: #eee;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #ui-container > * {
            pointer-events: auto;
        }

        /* Top bar - Resources */
        #resource-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid #4a4a6a;
            border-radius: 10px;
            padding: 15px 30px;
            display: flex;
            gap: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .resource-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Season tracker */
        #season-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid #4a4a6a;
            border-radius: 10px;
            padding: 15px 20px;
            min-width: 180px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #season-panel h3 {
            margin-bottom: 10px;
            font-size: 16px;
            color: #ffd700;
        }

        #season-panel .info-line {
            margin: 5px 0;
            font-size: 14px;
        }

        /* Left sidebar - Buildings */
        #building-menu {
            position: absolute;
            left: 20px;
            top: 100px;
            width: 280px;
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid #4a4a6a;
            border-radius: 10px;
            padding: 20px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #building-menu h2 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #ffd700;
            border-bottom: 2px solid #4a4a6a;
            padding-bottom: 10px;
        }

        .building-tier {
            margin-bottom: 20px;
        }

        .building-tier h3 {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .building-item {
            background: rgba(74, 74, 106, 0.3);
            border: 2px solid #4a4a6a;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .building-item:hover:not(.locked):not(.disabled) {
            background: rgba(74, 74, 106, 0.6);
            border-color: #6a6a8a;
            transform: translateX(5px);
        }

        .building-item.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .building-item.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .building-item.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .building-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .building-cost {
            font-size: 12px;
            color: #aaa;
        }

        .building-effect {
            font-size: 11px;
            color: #8af;
            margin-top: 3px;
        }

        /* Action log */
        #action-log {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid #4a4a6a;
            border-radius: 10px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .log-entry {
            padding: 5px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(74, 74, 106, 0.3);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-production { color: #8f8; }
        .log-consumption { color: #f88; }
        .log-event { color: #ff8; }
        .log-info { color: #8cf; }

        /* Action buttons */
        .action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            flex-direction: column;
            align-items: flex-end;
        }

        #end-turn-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
        }

        #end-turn-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
        }

        #end-turn-btn:active {
            transform: translateY(0);
        }

        #move-capital-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
        }

        #move-capital-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
        }

        #move-capital-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        #move-capital-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #move-capital-btn.active {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        #tooltip.visible {
            display: block;
        }

        .tooltip-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            color: #ffd700;
        }

        .tooltip-line {
            margin: 4px 0;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(74, 74, 106, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(74, 74, 106, 0.6);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(74, 74, 106, 0.8);
        }
    </style>
  <script type="module" crossorigin src="/assets/index-kIUOOjld.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>
        <div id="ui-container">
            <!-- Resource panel -->
            <div id="resource-panel">
                <div class="resource-item">
                    <span class="resource-icon">🌾</span>
                    <span id="food-count">8</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon">🪵</span>
                    <span id="wood-count">8</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon">🪨</span>
                    <span id="stone-count">3</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon">👥</span>
                    <span id="population-count">2/2</span>
                </div>
            </div>

            <!-- Season panel -->
            <div id="season-panel">
                <h3 id="season-name">Spring</h3>
                <div class="info-line">Turn: <span id="turn-number">1</span>/12</div>
                <div class="info-line">Year: <span id="year-number">1</span></div>
            </div>

            <!-- Building menu -->
            <div id="building-menu">
                <h2>Buildings</h2>
                <div id="building-list"></div>
            </div>

            <!-- Action log -->
            <div id="action-log">
                <div class="log-entry log-info">Game started! Find the exit before winter kills your colony.</div>
            </div>

            <!-- Action buttons -->
            <div class="action-buttons">
                <button id="move-capital-btn">Move Capital (5🪵 3🌾)</button>
                <button id="end-turn-btn">End Turn</button>
            </div>

            <!-- Tooltip -->
            <div id="tooltip"></div>
        </div>
    </div>

</body>
</html>
